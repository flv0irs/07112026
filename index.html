<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merry Christmas & Happy New Year</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cormorant Garamond & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        themeBg: '#A65D6D',
                        themeBgDark: '#7A3B49',
                        themeBgLight: '#BA7282',
                        cream: '#FDF8F5',
                        creamDark: '#F4ECE7',
                        goldAccent: '#E8C5C8',
                        goldWarm: '#D4AF37',
                        deepRose: '#4A1F27'
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Montserrat"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #A65D6D;
            color: #FDF8F5;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .snap-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .snap-section {
            scroll-snap-align: start;
            scroll-snap-stop: always;
            min-height: 100vh;
            width: 100vw;
        }

        .ambient-glow {
            background: radial-gradient(circle, rgba(248, 225, 228, 0.18) 0%, rgba(166, 93, 109, 0) 70%);
        }

        #snowCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        .wax-seal {
            background: radial-gradient(circle at 30% 30%, #E8C5C8, #A65D6D);
            box-shadow: 0 4px 12px rgba(74, 31, 39, 0.25), inset 0 1px 2px rgba(255,255,255,0.5);
        }

        .envelope-card {
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .envelope-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 18px 30px rgba(74, 31, 39, 0.25);
        }

        .glass-panel {
            background: rgba(253, 248, 245, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(253, 248, 245, 0.15);
        }

        .glass-button {
            background: rgba(253, 248, 245, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(253, 248, 245, 0.25);
            transition: all 0.3s ease;
        }

        .glass-button:hover {
            background: rgba(253, 248, 245, 0.95);
            color: #4A1F27;
            border-color: rgba(253, 248, 245, 1);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .snap-container::-webkit-scrollbar {
            width: 6px;
        }
        .snap-container::-webkit-scrollbar-track {
            background: #7A3B49;
        }
        .snap-container::-webkit-scrollbar-thumb {
            background: #E8C5C8;
            border-radius: 3px;
        }
    </style>
</head>
<body class="relative">

    <!-- Interactive Ambient Snow Canvas -->
    <canvas id="snowCanvas"></canvas>

    <div class="snap-container">

        <!-- SECTION 1: HERO COVER -->
        <section id="hero" class="snap-section relative flex flex-col items-center justify-between py-12 px-6 text-center select-none overflow-hidden">
            <div class="absolute inset-0 ambient-glow pointer-events-none"></div>

            <div class="pt-6">
                <span class="inline-block px-4 py-1.5 rounded-full glass-panel text-xs tracking-widest uppercase text-cream/90 font-light">
                    ✨ 2027
                </span>
            </div>

            <!-- Single Second Sentence Only -->
            <div class="max-w-2xl mx-auto space-y-6 my-auto z-20 px-4">
                <p class="font-serif italic text-2xl sm:text-4xl text-cream font-normal leading-relaxed drop-shadow-sm">
                    Yeni yılın sana tüm güzellikleri, neşeyi ve huzuru getirmesi dileğiyle...
                </p>
            </div>

            <!-- Scroll Down CTA Button -->
            <div class="pb-6 z-20">
                <button onclick="scrollToContent()" class="glass-button px-8 py-3.5 rounded-full text-xs uppercase tracking-widest font-medium flex items-center gap-3 group">
                    <span>Keşfet</span>
                    <i class="fa-solid fa-chevron-down text-xs group-hover:translate-y-1 transition-transform duration-300"></i>
                </button>
            </div>
        </section>


        <!-- SECTION 2: 6 ENVELOPES & FOOTER -->
        <section id="content" class="snap-section relative flex flex-col justify-between py-8 px-4 sm:px-8 max-w-5xl mx-auto z-20">
            
            <div class="text-center space-y-2 mt-2">
                <h2 class="font-serif text-3xl sm:text-4xl font-normal text-cream">
                    Mektuplar
                </h2>
                <div class="w-12 h-0.5 bg-goldAccent/40 mx-auto rounded-full"></div>
            </div>

            <!-- Grid of 6 Clean Heart Envelopes -->
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-5 sm:gap-6 my-auto py-4">
                
                <!-- Envelope 1 -->
                <div onclick="openEnvelope(1)" class="envelope-card bg-cream text-deepRose rounded-2xl p-6 shadow-xl cursor-pointer relative overflow-hidden flex flex-col items-center justify-center h-44 sm:h-48 border border-goldAccent/40">
                    <div class="w-14 h-14 rounded-full wax-seal flex items-center justify-center text-cream text-xl shadow-md">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                </div>

                <!-- Envelope 2 -->
                <div onclick="openEnvelope(2)" class="envelope-card bg-cream text-deepRose rounded-2xl p-6 shadow-xl cursor-pointer relative overflow-hidden flex flex-col items-center justify-center h-44 sm:h-48 border border-goldAccent/40">
                    <div class="w-14 h-14 rounded-full wax-seal flex items-center justify-center text-cream text-xl shadow-md">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                </div>

                <!-- Envelope 3 -->
                <div onclick="openEnvelope(3)" class="envelope-card bg-cream text-deepRose rounded-2xl p-6 shadow-xl cursor-pointer relative overflow-hidden flex flex-col items-center justify-center h-44 sm:h-48 border border-goldAccent/40">
                    <div class="w-14 h-14 rounded-full wax-seal flex items-center justify-center text-cream text-xl shadow-md">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                </div>

                <!-- Envelope 4 -->
                <div onclick="openEnvelope(4)" class="envelope-card bg-cream text-deepRose rounded-2xl p-6 shadow-xl cursor-pointer relative overflow-hidden flex flex-col items-center justify-center h-44 sm:h-48 border border-goldAccent/40">
                    <div class="w-14 h-14 rounded-full wax-seal flex items-center justify-center text-cream text-xl shadow-md">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                </div>

                <!-- Envelope 5 -->
                <div onclick="openEnvelope(5)" class="envelope-card bg-cream text-deepRose rounded-2xl p-6 shadow-xl cursor-pointer relative overflow-hidden flex flex-col items-center justify-center h-44 sm:h-48 border border-goldAccent/40">
                    <div class="w-14 h-14 rounded-full wax-seal flex items-center justify-center text-cream text-xl shadow-md">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                </div>

                <!-- Envelope 6 -->
                <div onclick="openEnvelope(6)" class="envelope-card bg-cream text-deepRose rounded-2xl p-6 shadow-xl cursor-pointer relative overflow-hidden flex flex-col items-center justify-center h-44 sm:h-48 border border-goldAccent/40">
                    <div class="w-14 h-14 rounded-full wax-seal flex items-center justify-center text-cream text-xl shadow-md">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                </div>

            </div>

            <!-- FOOTER WITH IDENTICAL INSTAGRAM BUTTONS -->
            <footer class="pt-4 pb-6 flex flex-col items-center text-center space-y-4 border-t border-cream/15 w-full">
                
                <div class="flex flex-row justify-center items-center gap-4 w-full max-w-sm">
                    <!-- Instagram 1 -->
                    <a href="https://instagram.com/marcus.blada" target="_blank" rel="noopener noreferrer" 
                       class="glass-button flex-1 py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 text-xs font-medium tracking-wide">
                        <i class="fa-brands fa-instagram text-base"></i>
                        <span>@marcus.blada</span>
                    </a>

                    <!-- Instagram 2 -->
                    <a href="https://instagram.com/sinfulv0w" target="_blank" rel="noopener noreferrer" 
                       class="glass-button flex-1 py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 text-xs font-medium tracking-wide">
                        <i class="fa-brands fa-instagram text-base"></i>
                        <span>@sinfulv0w</span>
                    </a>
                </div>

                <p class="text-[11px] text-cream/60 font-light tracking-wider">
                    tarafından yapılmıştır
                </p>
            </footer>

        </section>

    </div>

    <!-- SIMPLE NOTE MODAL (READY FOR YOUR CUSTOM TEXT) -->
    <div id="envelopeModal" class="fixed inset-0 bg-deepRose/70 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div id="modalCard" class="bg-cream text-deepRose rounded-2xl p-8 sm:p-10 max-w-md w-full text-center relative shadow-2xl transform scale-95 transition-transform duration-300 border border-goldAccent">
            
            <button onclick="closeModal()" class="absolute top-4 right-4 text-deepRose/40 hover:text-deepRose transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <div class="w-12 h-12 rounded-full bg-themeBg/10 text-themeBg flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-heart text-xl text-themeBg"></i>
            </div>

            <!-- Content Area -->
            <div class="py-6 px-4 bg-creamDark/50 rounded-xl border border-goldAccent/30 mb-6">
                <p id="modalMessage" class="font-serif italic text-lg text-deepRose/90 leading-relaxed">
                    <!-- Text loaded from script -->
                </p>
            </div>

            <button onclick="closeModal()" class="w-full bg-themeBg text-cream py-3 rounded-xl text-xs uppercase tracking-widest font-semibold hover:bg-themeBgDark transition-colors shadow-md">
                Kapat
            </button>
        </div>
    </div>

    <script>
        // Updated custom New Year notes
        const notes = {
            1: "Dürüst olalım; bu yıl da en çok birbirimizin kafasını şişirdik ama yine birbirimiz olmadan yapamadık! 2027'de de aynı performansla devam etmeye hazırım. Sen sadece yanımda kal, gerisini hallederiz! 💖✨",
            2: "Hayat bazen çok karmaşıklaştığında 'iyi ki var' dediğim ilk kişisin. Derdimi anlatırken de, nedensizce gülerken de iyi ki seninle bu yolu yürüyorum. Yeni yıl sana tüm dileklerini getirsin canım benim! 🌸",
            3: "Bu yılı güzelleştiren şey takvimdeki tarihler değil, seninle biriktirdiğimiz o küçük anlardı. 2027’de de bolca anı, sonsuz dedikodu ve unutulmaz anlar biriktirmek dileğiyle! 🥂⭐",
            4: "Seninle olan dostluğumuz tam olarak 'herkes gider ama biz kalırız' kafası. İçim o kadar rahat ki! Yeni yılda şans, neşe ve tüm güzellikler seni bulsun, sen en iyilerine layıksın. 🚀💕",
            5: "Yeni yıl hedeflerim listesinin ilk sırasına yine seni koydum: 'Bu kızla daha çok vakit geçir ve saçmalamaya devam et!' Bana kattığın her güzel duygu için çok teşekkür ederim. ✨🎄",
            6: "Dünyadaki tüm olumsuzluklara rağmen seninle bir araya gelince her şeyi unutabiliyoruz ya, işte o güç çok başka. 2027 bize sadece kahkaha, mutluluk ve huzur getirsin. Seni çok seviyorum! ❤️"
        };

        function scrollToContent() {
            document.getElementById('content').scrollIntoView({ behavior: 'smooth' });
        }

        function openEnvelope(id) {
            const modal = document.getElementById('envelopeModal');
            const card = document.getElementById('modalCard');
            document.getElementById('modalMessage').innerText = notes[id] || "Not...";
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('scale-95');
                card.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('envelopeModal');
            const card = document.getElementById('modalCard');
            modal.classList.add('opacity-0');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        document.getElementById('envelopeModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Background Snowfall
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const numFlakes = 45;
        const flakes = [];

        for (let i = 0; i < numFlakes; i++) {
            flakes.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 2 + 0.8,
                density: Math.random() * 0.4 + 0.1,
                opacity: Math.random() * 0.4 + 0.2
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < numFlakes; i++) {
                const f = flakes[i];
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = `rgba(253, 248, 245, ${f.opacity})`;
                ctx.fill();

                f.y += Math.pow(f.density, 2) + 0.4;
                f.x += Math.sin(f.y / 25) * 0.2;

                if (f.y > height) {
                    f.y = -10;
                    f.x = Math.random() * width;
                }
            }

            requestAnimationFrame(drawSnow);
        }

        window.onload = function() {
            drawSnow();
        };
    </script>
</body>
</html>
